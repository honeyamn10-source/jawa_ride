<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#181c1a" />
    <title>Jawa Ride · Go your own way</title>
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Jawa Ride home"
        ><span class="brand-symbol" aria-hidden="true"
          ><svg viewBox="0 0 36 36">
            <path
              d="M21 9v15c0 6-4 8-9 6"
              fill="none"
              stroke="currentColor"
              stroke-width="5"
              stroke-linecap="round"
            />
            <path
              d="M12 11h12V5"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            /></svg></span
        ><span
          >jawa<span class="brand-light">ride</span
          ><span class="brand-period">.</span></span
        ></a
      >
      <nav
        id="primary-nav"
        class="desktop-nav"
        aria-label="Main navigation"
        hidden
      ></nav>
      <div id="account"></div>
    </header>
    <main id="app"></main>
    <nav id="mobile-nav" aria-label="Mobile navigation" hidden></nav>
    <div id="notice" role="status" aria-live="polite"></div>
    <footer>
      <a class="footer-wordmark" href="/">jawa ride.</a
      ><span>A fair fare. A better way there.</span
      ><span>Cash, by choice.</span>
    </footer>
  </body>
</html>
